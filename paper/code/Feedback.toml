[metadata]
author = "jdv27@cornell.edu"
date = "03/19/26"
version = "0.1"
description = "Linear pathway with feedback inhibition"

[model]
list_of_static_species = ["E1", "E2", "E3"]
list_of_dynamic_species = ["X1", "X2", "X3", "X4", "X5"]

list_of_connection_records = [
    "r1::{X1} --> X2",
    "r2::{X2} --> X3",
    "r3::X3 --> X4",
    "r5::X3 --> X5",
    "r0::{} --> X1",
    "r4::X4 --> {}"
]

list_of_kinetics_records = [
    "r0::{}",
    "r1::{X1,X4,E1}",
    "r2::{X2,E2}",
    "r3::{X3,E3}",
    "r4::{X4}",
    "r5::{X3}"
]
